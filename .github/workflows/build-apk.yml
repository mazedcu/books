# Builds the app on GitHub's servers whenever you push.
# The APK is saved in the repository as dist/Storybooks.apk (and as a run artifact).
name: Build APK
on:
  push:
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Storybooks-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Save the APK in the repository
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Storybooks.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/Storybooks.apk
          git commit -m "Add built APK [skip ci]" || echo "No change"
          git push
