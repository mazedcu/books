plugins {
    id 'com.android.application'
}

android {
    namespace 'com.radon.storybooks'
    compileSdk 34

    defaultConfig {
        applicationId "com.radon.storybooks"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // keep the story files uncompressed so they load fast
    androidResources {
        noCompress += ['woff2']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
